services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      API_KEY: dev-secret
      JWT_SECRET: dev-jwt-secret-at-least-32-characters-long
      REDIS_URL: redis://redis:6379
      SQLITE_PATH: /app/data/llm-shadow-proxy.sqlite
    volumes:
      - ./data:/app/data
