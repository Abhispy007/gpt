spring.application.name=llm-shadow-proxy-gpt
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info

app.auth.api-key=${API_KEY:}

primary.url=${PRIMARY_URL:}
candidate.url=${CANDIDATE_URL:}

shadow.sqlite.path=${SQLITE_PATH:./data/llm-shadow-proxy.sqlite}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

shadow.queue.backend=${SHADOW_QUEUE_BACKEND:redis}
shadow.queue.stream-key=${SHADOW_QUEUE_STREAM:llm-shadow:shadow-jobs}
shadow.queue.group=${SHADOW_QUEUE_GROUP:llm-shadow-proxy}
shadow.queue.consumer=${HOSTNAME:${random.uuid}}
shadow.queue.dead-letter-stream=${SHADOW_QUEUE_DLQ:llm-shadow:shadow-jobs:dead-letter}
shadow.queue.retry-zset=${SHADOW_QUEUE_RETRY_ZSET:llm-shadow:shadow-jobs:retry}
shadow.queue.poll-delay-ms=250
shadow.queue.batch-size=10
shadow.queue.read-timeout-ms=100
shadow.retry.max-attempts=3
shadow.retry.backoff-ms=1000
shadow.circuit-breaker.enabled=true
shadow.circuit-breaker.failure-threshold=3
shadow.circuit-breaker.open-duration-ms=10000
shadow.redaction.sensitive-keys=customerId,email,phone,ssn,token,apiKey,password

shadow.executor.core-pool-size=2
shadow.executor.max-pool-size=4
shadow.executor.queue-capacity=100
shadow.executor.await-termination-seconds=3
