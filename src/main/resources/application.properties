spring.application.name=llm-shadow-proxy-gpt
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info

app.auth.api-key=${API_KEY:}
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.auth.jwt-issuer=${JWT_ISSUER:llm-shadow-proxy}
app.http-client.connect-timeout-ms=1000
app.http-client.read-timeout-ms=2000
app.request-limits.max-body-bytes=${MAX_REQUEST_BODY_BYTES:1048576}
app.request-limits.max-prompt-chars=${MAX_PROMPT_CHARS:8000}
app.request-limits.max-input-json-bytes=${MAX_INPUT_JSON_BYTES:262144}
app.request-limits.max-input-depth=${MAX_INPUT_DEPTH:24}
app.request-limits.max-estimated-tokens=${MAX_ESTIMATED_TOKENS:12000}

primary.url=${PRIMARY_URL:}
candidate.url=${CANDIDATE_URL:}

shadow.sqlite.path=${SQLITE_PATH:./data/llm-shadow-proxy.sqlite}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

shadow.queue.backend=${SHADOW_QUEUE_BACKEND:redis}
shadow.queue.stream-key=${SHADOW_QUEUE_STREAM:llm-shadow:shadow-jobs}
shadow.queue.group=${SHADOW_QUEUE_GROUP:llm-shadow-proxy}
shadow.queue.consumer=${HOSTNAME:${random.uuid}}
shadow.queue.dead-letter-stream=${SHADOW_QUEUE_DLQ:llm-shadow:shadow-jobs:dead-letter}
shadow.queue.retry-zset=${SHADOW_QUEUE_RETRY_ZSET:llm-shadow:shadow-jobs:retry}
shadow.queue.poll-delay-ms=50
shadow.queue.batch-size=10
shadow.queue.read-timeout-ms=100
shadow.queue.pending-idle-ms=${SHADOW_QUEUE_PENDING_IDLE_MS:30000}
shadow.retry.max-attempts=3
shadow.retry.backoff-ms=1000
shadow.circuit-breaker.failure-threshold=3
shadow.circuit-breaker.open-duration-ms=10000
shadow.backpressure.max-queued-jobs=${SHADOW_BACKPRESSURE_MAX_QUEUED_JOBS:10000}
shadow.backpressure.max-outbox-jobs=${SHADOW_BACKPRESSURE_MAX_OUTBOX_JOBS:1000}
shadow.backpressure.reject-when-candidate-circuit-open=${SHADOW_BACKPRESSURE_REJECT_WHEN_CANDIDATE_CIRCUIT_OPEN:false}

resilience4j.circuitbreaker.instances.candidate.register-health-indicator=true
resilience4j.circuitbreaker.instances.candidate.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.candidate.sliding-window-size=${shadow.circuit-breaker.failure-threshold}
resilience4j.circuitbreaker.instances.candidate.minimum-number-of-calls=${shadow.circuit-breaker.failure-threshold}
resilience4j.circuitbreaker.instances.candidate.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.candidate.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.candidate.wait-duration-in-open-state=${shadow.circuit-breaker.open-duration-ms}ms
resilience4j.circuitbreaker.instances.candidate.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.ratelimiter.instances.proxy.limit-for-period=${PROXY_RATE_LIMIT_PER_PERIOD:60}
resilience4j.ratelimiter.instances.proxy.limit-refresh-period=${PROXY_RATE_LIMIT_REFRESH_PERIOD:1s}
resilience4j.ratelimiter.instances.proxy.timeout-duration=0
shadow.redaction.sensitive-keys=customerId,email,phone,ssn,token,apiKey,password

shadow.executor.core-pool-size=2
shadow.executor.max-pool-size=4
shadow.executor.queue-capacity=100
shadow.executor.await-termination-seconds=3
